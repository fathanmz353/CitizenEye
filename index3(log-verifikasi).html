<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log-Verifikasi - Data Pengguna Pernah Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6" x-data="logVerifikasiApp()">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl border border-slate-700/60 shadow-xl">
      <div>
        <div class="flex items-center gap-2 text-indigo-400 font-semibold text-sm">
          <i class="ph-bold ph-shield-check text-lg"></i>
          <span>Panel Log-Verifikasi</span>
        </div>
        <h1 class="text-2xl font-bold text-white mt-1">Daftar Pengguna Pernah Login</h1>
        <p class="text-xs text-slate-400">Hanya menampilkan akun yang sukses login dan terverifikasi di sistem</p>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <a href="data-masyarakat.html" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium">
          <i class="ph-bold ph-arrow-left"></i> Panel Admin Laporan
        </a>
        <button @click="clearLogs()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium">
          <i class="ph-bold ph-trash"></i> Bersihkan Data
        </button>
      </div>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Total Akun Pernah Login</p>
          <h3 class="text-2xl font-bold text-white mt-1" x-text="loggedUsers.length">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl">
          <i class="ph-bold ph-users"></i>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Status Sistem Log</p>
          <h3 class="text-sm font-bold text-emerald-400 mt-2">Aktif & Sinkron Otomatis</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl">
          <i class="ph-bold ph-check-circle"></i>
        </div>
      </div>
    </div>

    <!-- Grid Card Data Pengguna Pernah Login -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <template x-for="user in loggedUsers" :key="user.username">
        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
          <div class="flex items-start justify-between">
            <div>
              <h4 class="text-lg font-bold text-white" x-text="user.username"></h4>
              <p class="text-xs text-slate-400" x-text="'Waktu Login: ' + user.loginTime"></p>
            </div>
            <span class="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-lg border border-emerald-500/30 font-medium">Terverifikasi</span>
          </div>
        </div>
      </template>

      <div x-show="loggedUsers.length === 0" class="col-span-full bg-slate-800/40 border border-slate-700/50 rounded-2xl p-8 text-center text-slate-400 text-sm">
        Belum ada pengguna yang tercatat dalam log verifikasi.
      </div>
    </div>
  </div>

  <script>
    function logVerifikasiApp() {
      return {
        loggedUsers: JSON.parse(localStorage.getItem('adminLogs')) || [],
        clearLogs() {
          if (confirm('Yakin ingin mengosongkan log verifikasi?')) {
            localStorage.removeItem('adminLogs');
            this.loggedUsers = [];
          }
        }
      }
    }
  </script>
</body>
</html>
