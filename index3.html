<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Login Kredensial Khusus</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white"
      x-data="loginApp()">

  <!-- ================= CONTAINER UTAMA ================= -->
  <div class="w-full max-w-md">
    
    <!-- CARD LOGIN (Tampil jika belum login) -->
    <div x-show="!isLoggedIn" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-indigo-950/40 relative overflow-hidden">
      
      <!-- Dekorasi Akses Visual -->
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Header Login -->
      <div class="text-center mb-6 relative z-10">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-3 shadow-lg shadow-indigo-600/10">
          <i class="ph-bold ph-lock-key text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Akses Terbatas</h1>
        <p class="text-xs text-slate-400 mt-1">Silakan masukkan nama dan kata sandi resmi</p>
      </div>

      <!-- Alert Pesan Error -->
      <div x-show="errorMessage" 
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           class="mb-5 bg-rose-500/10 border border-rose-500/30 text-rose-300 px-3.5 py-2.5 rounded-xl text-xs flex items-center gap-2">
        <i class="ph-bold ph-warning-circle text-lg shrink-0 text-rose-400"></i>
        <span x-text="errorMessage"></span>
      </div>


      <form @submit.prevent="handleLogin" class="space-y-4 relative z-10">
      
        <div>
          <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5">Nama Pengguna</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="ph-bold ph-user text-base"></i>
            </div>
            <input type="text" id="username" x-model="username" required autocomplete="off"
                   placeholder="Masukkan nama pengguna" 
                   class="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-2.5 pl-10 pr-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-150 placeholder:text-slate-500">
          </div>
        </div>

        
        <div>
          <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Kata Sandi</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="ph-bold ph-key-hole text-base"></i>
            </div>
            <input :type="showPassword ? 'text' : 'password'" id="password" x-model="password" required
                   placeholder="Masukkan kata sandi" 
                   class="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-2.5 pl-10 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-150 placeholder:text-slate-500">
            
            <button type="button" @click="showPassword = !showPassword" 
                    class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 text-base">
              <i class="ph-bold" :class="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

  
        <button type="submit" 
                :disabled="isLoading"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition duration-150 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed mt-2">
          <span x-show="!isLoading" class="flex items-center gap-2">
            Masuk <i class="ph-bold ph-arrow-right"></i>
          </span>
          <span x-show="isLoading" class="flex items-center gap-2" style="display: none;">
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Memverifikasi...
          </span>
        </button>
      </form>
    </div>

    
    <div x-show="isLoggedIn" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         style="display: none;"
         class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden">
      
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 mb-4 shadow-lg shadow-emerald-500/10">
        <i class="ph-bold ph-check-circle text-3xl"></i>
      </div>

      <h2 class="text-2xl font-bold text-white mb-1">Selamat Datang Kembali!</h2>
      <p class="text-sm text-slate-400 mb-6">Anda telah berhasil diautentikasi dengan hak akses resmi.</p>

    
      <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 mb-6 text-left space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-400">Nama Pengguna:</span>
          <span class="text-sm font-semibold text-indigo-400 font-mono" x-text="currentUser?.username"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-400">Role / Hak Akses:</span>
          <span class="text-xs px-2 py-0.5 rounded font-medium" 
                :class="currentUser?.role === 'Administrator' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'"
                x-text="currentUser?.role"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-400">Waktu Login:</span>
          <span class="text-xs text-slate-300" x-text="loginTime"></span>
        </div>
      </div>

    
      <button @click="handleLogout" 
              class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 px-4 rounded-xl text-sm transition duration-150 flex items-center justify-center gap-2">
        <a href="verifikasi.html">masuk panel admin</a>
      </button>
    </div>

  </div>

  <script>
    function loginApp() {
      return {
        // Data input form
        username: '',
        password: '',
        showPassword: false,
        isLoading: false,
        errorMessage: '',

        // State login & user aktif
        isLoggedIn: false,
        currentUser: null,
        loginTime: '',

        // DATABASE KREDENSIAL TERDAFTAR (Kredensial Khusus)
        validCredentials: [
          { username: 'fathan', password: 'admin1', role: 'Administrator' },
          { username: 'arsavin', password: 'admin2', role: 'Administrator' },
          { username: 'rayyan', password: 'admin3', role: 'Administrator' },
          { username: 'admin4', password: 'admin4', role: 'Administrator' },
        ],

        // Fungsi memuat cepat kredensial dari tombol petunjuk
        fillCredentials(user, pass) {
          this.username = user;
          this.password = pass;
          this.errorMessage = '';
        },

        // Proses autentikasi login
        handleLogin() {
          this.errorMessage = '';
          this.isLoading = true;

          // Simulasi delay jaringan (500ms) untuk efek realistis
          setTimeout(() => {
            const trimmedUsername = this.username.trim();
            
            // Pencocokan kredensial (Case-sensitive untuk nama & kata sandi)
            const foundUser = this.validCredentials.find(
              acc => acc.username === trimmedUsername && acc.password === this.password
            );

            if (foundUser) {
              // Jika berhasil login
              this.isLoggedIn = true;
              this.currentUser = {
                username: foundUser.username,
                role: foundUser.role
              };
              this.loginTime = new Date().toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              });
              // Reset field input
              this.password = '';
            } else {
              // Jika kredensial salah
              this.errorMessage = 'Nama pengguna atau kata sandi tidak sesuai!';
            }

            this.isLoading = false;
          }, 500);
        },

        // Proses logout
        handleLogout() {
          this.isLoggedIn = false;
          this.currentUser = null;
          this.username = '';
          this.password = '';
          this.errorMessage = '';
        }
      }
    }
  </script>
</body>
</html>
